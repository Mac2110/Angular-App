<mat-card-content class="filter">
<mat-card class="selection">
  <mat-card-header>
    <mat-card-title>Filter Selection</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <div>
        <mat-card-content>
            <div class="content">
            <mat-form-field style="width: 18%;" appearance="outline"> 
                <mat-label>Customer</mat-label> 
                <mat-select> 
                <mat-option [value]="option" *ngFor="let option of userNameList"> {{option.label}} </mat-option>
                </mat-select> 
            </mat-form-field> 
            <mat-form-field style="width: 18%;" appearance="outline"> 
                <mat-label>Country</mat-label> 
                <mat-select> 
                <mat-option [value]="option" *ngFor="let option of countryNameList"> {{option.label}} </mat-option>
                </mat-select> 
            </mat-form-field> 
          <button mat-mini-fab color="basic" style="border-radius: 20%;margin-top: 10px;background-color:rgb(210, 210, 42);"><mat-icon fontIcon="play_arrow"></mat-icon></button>
        </div>
        </mat-card-content>
  </div>
</mat-card>
</mat-card-content>
<br>
<!-- ------------------------------Table------------------------------------------------ -->
<mat-card-content class="filter">
<mat-card>
    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource">
      
          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element"> {{element.position}} </td>
          </ng-container>
      
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>
      
          <!-- Weight Column -->
          <ng-container matColumnDef="department">
            <th mat-header-cell *matHeaderCellDef> Department </th>
            <td mat-cell *matCellDef="let element"> {{element.department}} </td>
          </ng-container>
      
          <!-- Symbol Column -->
          <ng-container matColumnDef="casestudy">
            <th mat-header-cell *matHeaderCellDef> Case Study </th>
            <td mat-cell *matCellDef="let element"> {{element.casestudy}} </td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let element"> <p><mat-slide-toggle [checked]="checked"></mat-slide-toggle></p></td>
          </ng-container>
      
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      
       <mat-paginator [pageSizeOptions]="[6, 10]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>
      </div>
</mat-card>
</mat-card-content>
